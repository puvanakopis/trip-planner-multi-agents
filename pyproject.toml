[project]
name = "ceylontrip-ai"
version = "0.1.0"
description = "AI Travel Operations System for Sri Lanka built with Streamlit, LangChain, and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.25.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-groq>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]